[package]
name = "hbmon"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Harness-independent, OS-independent build monitor for LLM-driven development"
repository = "https://github.com/aydemir/hbmon"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
crossbeam-channel = "0.5"
libc = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
