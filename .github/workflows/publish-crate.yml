name: publish-crate

# Manuel crates.io yayını (TASK-033). Binary release'ten ayrı tutulur:
# publish geri alınamaz, insan kapısı şart. Girdi olarak tag adı alır.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Yayınlanacak tag (örn. v0.1.2)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: verify tag matches Cargo.toml
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          tag="${{ inputs.tag }}"
          [ "v$ver" = "$tag" ] || { echo "tag $tag != Cargo.toml v$ver"; exit 1; }
      - name: dry-run + publish
        shell: bash
        run: |
          cargo publish --dry-run
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
